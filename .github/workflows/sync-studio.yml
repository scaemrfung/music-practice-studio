name: One-time studio sync (pinned)
on:
  push:
    branches: [sync-gameplan]
    paths: ['.github/workflows/sync-studio.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-gameplan
      - name: Fetch pinned source and verify
        run: |
          curl -fsSL https://raw.githubusercontent.com/scaemrfung/Grade-1-Music/2102457204534619ba0e276222779eb369d4f124/studio-tools.js -o src.js
          echo "ac277037a32679f197ffedccfd7c2523b370f7093f2ae4b85590642c226fa2c3  src.js" | sha256sum -c -
      - name: Build standalone studio.js
        run: |
          cat > t.py <<'PYEOF'
          import sys
          src=open('src.js').read()
          R=[("/* Grade 1 Music · Studio tools","/* Music Practice Studio"),
             ("Mr. Fung's picture set","a picture set"),
             ('return "/Grade-1-Music/assets/handsigns/";','return "assets/handsigns/";'),
             ("Most Grade 1 songs sit well","Most children's songs sit well"),
             ("The piano the lesson plans use.","Great on a classroom screen."),
             ("Use before a school concert or assembly.","Use before a class concert or assembly."),
             ("/* Songs from the lesson pages' score data (every","/* Traditional public-domain songs (every"),
             ("Echo by phrase, the way every song in the lessons is taught:","Echo by phrase, the way children's songs are usually taught:"),
             ("Echo the lesson songs phrase by phrase, then build them up","Echo favourite songs phrase by phrase, then build them up"),
             ('Card " + (i + 1) + " · Grade 1 Music', 'Card " + (i + 1) + " · Music Practice Studio')]
          for a,b in R:
              n=src.count(a); assert n>=1,(a,n); src=src.replace(a,b)
          open('studio.js','w').write(src)
          PYEOF
          python3 t.py
          echo "0436f83c76dc83d272bf6eda00e5758eb80b1135af34b54e63f84adfc0ac1ca4  studio.js" | sha256sum -c -
          rm -f src.js t.py
      - name: Update index.html
        run: |
          sed -i -e 's/and 57 more music tools/and 59 more music tools/' -e 's/studio.js?v=4/studio.js?v=5/' index.html
          echo "a117389e63fea98cbcf03a0c182e2b6997d25ab736c5f12921ab4907d828983a  index.html" | sha256sum -c -
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio.js index.html
          git commit -m "Sync standalone: 60 tools (wood/metal/skin, bordun, 6/8, repeat sign, introduction)"
          git push origin HEAD:sync-gameplan
