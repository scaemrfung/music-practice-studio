name: Assemble studio files
on:
  push:
    branches: [main]
    paths: [".github/workflows/assemble.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build studio.js from the pinned source commit
        run: |
          set -euo pipefail
          SRC=https://raw.githubusercontent.com/scaemrfung/Grade-1-Music/9d2c796a16802f1caba5a6f6a0c264f6767dd7b0
          curl -fsSL "$SRC/studio-tools.js" -o /tmp/src.js
          python3 - <<'PY'
          s = open('/tmp/src.js', encoding='utf-8').read()
          R = [("/* Grade 1 Music · Studio tools", "/* Music Practice Studio"),
               ("Most Grade 1 songs sit well", "Most children's songs sit well"),
               ("· Grade 1 Music</p>", "· Music Practice Studio</p>"),
               ("The piano the lesson plans use.", "Great on a classroom screen."),
               ('return "/Grade-1-Music/assets/handsigns/";', 'return "assets/handsigns/";'),
               ("Curwen / Kodály hand signs: Mr. Fung's picture set (assets/handsigns/*.png)", "Curwen / Kodály hand signs: a picture set (assets/handsigns/*.png)")]
          for a, b in R:
              assert s.count(a) == 1, a
              s = s.replace(a, b)
          open('studio.js', 'w', encoding='utf-8', newline='').write(s)
          PY
          echo "5cf61546897f86e1a9519890e151c74072bfa970a0367bf104bb5880442d213d  studio.js" | sha256sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio.js
          git diff --cached --quiet || git commit -m "Update studio.js: 48 tools"
          git push
