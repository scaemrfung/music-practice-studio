name: One-off patch (Steady beat Space key)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-beat-space.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply patch
        run: |
          set -e
          echo "" | base64 -d > /tmp/patch_beat.py
          python3 /tmp/patch_beat.py
      - name: Commit
        run: |
          git config user.name "Mr. Fung"
          git config user.email "scae.mr.fung@gmail.com"
          git add studio.js index.html
          git commit -m "Steady beat: Space starts and stops the beat from anywhere on the page"
          git push origin HEAD:main
